[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-of-babel"
version = "2.0.0"
description = "Tower of Babel -- privacy and anti-surveillance terminal suite (VOID, MASK, STRIP, CARRIER, MIRAGE)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "0BSD" }
authors = [{ name = "Tower of Babel contributors" }]
keywords = ["privacy", "tor", "e2e", "encrypted", "ephemeral", "terminal", "messenger", "steganography", "metadata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "textual>=0.60",
    "cryptography>=42",
    "websockets>=12",
    "python-socks[asyncio]>=2.4",
    "doubleratchet>=1.3,<2",
    "x3dh>=1.3,<2",
    # STRIP: PDF metadata parser. Pure-Python, MIT, no deps.
    "pypdf>=4.0",
    # CARRIER: PNG cover handling (Pillow, BSD-3) + Argon2id
    # reference implementation (argon2-cffi, MIT).
    "Pillow>=10",
    "argon2-cffi>=23",
    # MASK: async HTTP with SOCKS5 transport for the temp-mail
    # adapters (Tor-routed by default).
    "httpx[socks]>=0.27",
]

[project.scripts]
# v2.0.0: the only client entry point is `babel`. The legacy
# top-level aliases (void, mask, strip, carrier, mirage) were
# removed; interactive use goes through the menu, scripting goes
# through `babel --exec <tool> [args]`. See docs/V2_REDESIGN.md §4.5.
babel = "babel.__main__:main"
# Server is unrelated to the client suite and keeps its own alias.
void-server = "tools.void.server.main:main"

[project.urls]
Homepage = "https://github.com/deox420/tower_of_babel"
Source = "https://github.com/deox420/tower_of_babel"
Issues = "https://github.com/deox420/tower_of_babel/issues"

[tool.setuptools.packages.find]
include = ["babel*", "shared*", "tools*"]

[tool.setuptools.package-data]
"tools.mask.data" = ["*.json"]
